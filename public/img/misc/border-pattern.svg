<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 44" width="40" height="44">
  <!-- 横向回纹带单元 (40x44, 自动 repeat-x) -->
  <!-- 上下细线 -->
  <g stroke="rgba(212, 175, 55, 0.5)" stroke-width="0.6" fill="none">
    <line x1="0" y1="6" x2="40" y2="6"/>
    <line x1="0" y1="38" x2="40" y2="38"/>
  </g>
  <!-- 中间菱形+回纹 -->
  <g fill="rgba(212, 175, 55, 0.4)" stroke="rgba(212, 175, 55, 0.6)" stroke-width="0.5">
    <polygon points="20,18 26,22 20,26 14,22"/>
  </g>
  <g fill="none" stroke="rgba(212, 175, 55, 0.5)" stroke-width="0.5">
    <!-- 两侧回纹方块 (左右各 1 个) -->
    <path d="M 4 18 L 8 14 L 8 30 L 4 30 L 4 18 Z M 4 14 L 12 14 L 12 18 L 8 18"/>
    <path d="M 36 18 L 32 14 L 32 30 L 36 30 L 36 18 Z M 36 14 L 28 14 L 28 18 L 32 18"/>
  </g>
  <!-- 小圆点 -->
  <g fill="rgba(245, 215, 110, 0.7)">
    <circle cx="20" cy="10" r="0.8"/>
    <circle cx="20" cy="34" r="0.8"/>
  </g>
</svg>
