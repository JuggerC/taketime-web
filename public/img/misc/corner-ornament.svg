<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- 4 角共用装饰 (从角点 0,0 向中心延伸) — 克制版 -->
  <!-- 只有: 细藤蔓 + 几朵花 + 几个月牙 + 角落 L 细线 + 散点, 不要 spiral -->

  <!-- 装饰条带 (从角点向中心辐射, 2 条细线) -->
  <g fill="none" stroke="rgba(212, 175, 55, 0.55)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主藤蔓 (细) — 从 (0,0) 向右下 -->
    <path d="M 0 0 C 30 20, 60 50, 90 90 S 150 180, 200 240 S 280 290, 310 310"/>
    <!-- 副藤蔓 (更细) -->
    <path d="M 0 0 C 20 30, 50 70, 80 120 S 140 220, 180 280" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- 装饰月牙 (4 个, 各种朝向) -->
  <g>
    <path d="M 40 30 A 7 7 0 1 0 40 44 A 4.5 7 0 1 1 40 30 Z" fill="rgba(245, 215, 110, 0.7)"/>
    <path d="M 110 110 A 6 6 0 1 0 110 122 A 3.8 6 0 1 1 110 110 Z" fill="rgba(245, 215, 110, 0.65)"/>
    <path d="M 180 180 A 5 5 0 1 0 180 190 A 3.2 5 0 1 1 180 180 Z" fill="rgba(245, 215, 110, 0.6)"/>
    <path d="M 70 130 A 5 5 0 1 0 70 140 A 3 5 0 1 1 70 130 Z" fill="rgba(245, 215, 110, 0.6)"/>
  </g>

  <!-- 装饰小花 (3 朵 4 瓣) -->
  <g>
    <g transform="translate(120, 60)">
      <ellipse cx="0" cy="-7" rx="2.5" ry="5" fill="rgba(212, 175, 55, 0.7)"/>
      <ellipse cx="0" cy="7" rx="2.5" ry="5" fill="rgba(212, 175, 55, 0.7)"/>
      <ellipse cx="-7" cy="0" rx="5" ry="2.5" fill="rgba(212, 175, 55, 0.7)"/>
      <ellipse cx="7" cy="0" rx="5" ry="2.5" fill="rgba(212, 175, 55, 0.7)"/>
      <circle r="2" fill="rgba(245, 215, 110, 0.9)"/>
    </g>
    <g transform="translate(200, 130)">
      <ellipse cx="0" cy="-5" rx="2" ry="4" fill="rgba(212, 175, 55, 0.65)"/>
      <ellipse cx="0" cy="5" rx="2" ry="4" fill="rgba(212, 175, 55, 0.65)"/>
      <ellipse cx="-5" cy="0" rx="4" ry="2" fill="rgba(212, 175, 55, 0.65)"/>
      <ellipse cx="5" cy="0" rx="4" ry="2" fill="rgba(212, 175, 55, 0.65)"/>
      <circle r="1.5" fill="rgba(245, 215, 110, 0.8)"/>
    </g>
    <g transform="translate(60, 200)">
      <ellipse cx="0" cy="-5" rx="2" ry="4" fill="rgba(212, 175, 55, 0.6)"/>
      <ellipse cx="0" cy="5" rx="2" ry="4" fill="rgba(212, 175, 55, 0.6)"/>
      <ellipse cx="-5" cy="0" rx="4" ry="2" fill="rgba(212, 175, 55, 0.6)"/>
      <ellipse cx="5" cy="0" rx="4" ry="2" fill="rgba(212, 175, 55, 0.6)"/>
      <circle r="1.5" fill="rgba(245, 215, 110, 0.75)"/>
    </g>
  </g>

  <!-- 星点 (6 颗, 散落) -->
  <g fill="rgba(245, 215, 110, 0.7)">
    <circle cx="20" cy="20" r="1.5"/>
    <circle cx="50" cy="15" r="1"/>
    <circle cx="170" cy="50" r="1"/>
    <circle cx="200" cy="80" r="1"/>
    <circle cx="240" cy="160" r="1.2"/>
    <circle cx="290" cy="270" r="1.4"/>
  </g>

  <!-- 角落 L 形细线装饰 (克制版, 没有大圆点) -->
  <g fill="none" stroke="rgba(212, 175, 55, 0.5)" stroke-width="1.2" stroke-linecap="round">
    <path d="M 5 5 L 50 5"/>
    <path d="M 5 5 L 5 50"/>
  </g>
  <circle cx="5" cy="5" r="2" fill="rgba(245, 215, 110, 0.7)"/>
</svg>
